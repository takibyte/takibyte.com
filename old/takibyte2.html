<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>takibyte</title>
  <meta name="description" content="takibyte's personal website and link tree to blog, github, and tryhackme.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --background: #1a1b26;
      --overlay: #24283b;
      --text: #c0caf5;
      --accent1: #bb9af7;
      --accent2: #7aa2f7;
      --accent3: #ff9e64;
      --accent4: #f7768e;
    }
    @font-face {
      font-display: swap;
      font-family: 'Roboto Mono';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/robotomono/v23/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vqPQ--5Ip2sSQ.woff2') format('woff2');
    }
    html { font-size: 62.5%; }
    body {
      background-color: var(--background);
      color: var(--accent4);
      font-family: 'Roboto Mono', monospace;
      margin: 0; padding: 0;
      font-size: 2rem;
      overflow-x: hidden;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { color: var(--accent1); }
    .section {
      position: relative;
      display: grid;
      place-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .takibyte {
      background-image: radial-gradient(ellipse at 50% 100%, rgba(247,118,142,.08) 0%, transparent 75%);
    }
    .link-tree { background-color: var(--overlay); }
    .three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .section-content {
      position: relative; z-index: 1;
      display: grid;
      grid-auto-flow: column;
      justify-content: center;
      gap: 1rem;
      font-size: 5rem;
    }
    .link-tree-content {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      gap: 5rem;
      text-align: center;
      padding: 0 2rem;
      font-size: 5rem;
    }
    .divider {
      position: relative;
      height: 2px;
      background-image: linear-gradient(90deg, #1a1b26, #f7768e, #ff9e64, #f7768e, #1a1b26);
      z-index: 10;
      box-shadow: 0 0 18px 4px rgba(247,118,142,0.45), 0 0 55px 12px rgba(247,118,142,0.18);
    }
    .scroll-indicator {
      position: fixed;
      bottom: 5rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      opacity: 1; transition: opacity 0.4s ease;
      pointer-events: none; z-index: 100;
    }
    .scroll-indicator.hidden { opacity: 0; }
    .scroll-arrow-wrapper { animation: bounce 1.4s ease-in-out infinite; }
    .scroll-arrow {
      width: 2rem; height: 2rem;
      border-right: 2px solid var(--text);
      border-bottom: 2px solid var(--text);
      transform: rotate(45deg);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(6px); }
    }
  </style>
</head>
<body>

  <div class="section takibyte">
    <canvas class="three-canvas" id="redCanvas"></canvas>
    <div class="section-content" id="titleSection"></div>
  </div>

  <div class="divider"></div>

  <div class="section link-tree">
    <canvas class="three-canvas" id="blueCanvas"></canvas>
    <div class="link-tree-content">
      <a href="https://blog.takibyte.com">blog</a>
      <a href="https://github.com/takibyte">github</a>
      <a href="https://tryhackme.com/p/takibyte">tryhackme</a>
    </div>
  </div>

  <div class="scroll-indicator" id="scrollIndicator">
    <div class="scroll-arrow-wrapper"><div class="scroll-arrow"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ── scroll ────────────────────────────────────
  const indicator = document.getElementById('scrollIndicator');
  window.addEventListener('scroll', () => {
    indicator.classList.toggle('hidden', window.scrollY > window.innerHeight * 0.2);
  }, { passive: true });

  // ── binary title reveal ───────────────────────
  const word = 'takibyte';
  function getByte(ch) {
    const c = ch.charCodeAt(0);
    return Array.from({length:8},(_,i)=>String((c>>(7-i))&1));
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function animateChar(el, ch, delay, spd) {
    el.textContent = '\u00a0'; await sleep(delay);
    for (const b of getByte(ch)) { el.textContent = b; await sleep(spd); }
    await sleep(400); el.textContent = ch;
  }
  async function runEffect() {
    const el = document.querySelector('.section-content');
    el.innerHTML = [...word].map((_,i)=>`<span id="bc${i}"></span>`).join('');
    await sleep(10);
    await Promise.all([...word].map((ch,i)=>animateChar(document.getElementById('bc'+i),ch,i*50,200)));
  }
  async function titleLoop() { await runEffect(); await sleep(4000); titleLoop(); }
  document.addEventListener('DOMContentLoaded', titleLoop);

  // ─────────────────────────────────────────────
  // SHARED TEXTURE HELPERS
  // ─────────────────────────────────────────────
  const HEX = '0123456789ABCDEF';
  const rndHex = () => HEX[Math.floor(Math.random()*16)] + HEX[Math.floor(Math.random()*16)];

  function makeByteTexture(hex, color, glowing, cache) {
    const key = hex+'|'+color+'|'+glowing;
    if (cache && cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 22px "Roboto Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (glowing) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
    ctx.fillStyle = color;
    ctx.fillText(hex, 32, 20);
    const t = new THREE.CanvasTexture(c);
    if (cache) cache[key] = t;
    return t;
  }

  function makeLabelTexture(text, color, cache) {
    const key = 'lbl|'+text+'|'+color;
    if (cache && cache[key]) return cache[key];
    const c = document.createElement('canvas');
    c.width = 256; c.height = 36;
    const ctx = c.getContext('2d');
    ctx.font = '13px "Roboto Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.fillText(text, 4, 18);
    const t = new THREE.CanvasTexture(c);
    if (cache) cache[key] = t;
    return t;
  }

  function makeGlitchTexture(hex, color) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 22px "Roboto Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const bands = 4 + Math.floor(Math.random()*4);
    for (let b=0; b<bands; b++) {
      const y0=(b/bands)*40, h=40/bands;
      const xOff=(Math.random()-0.5)*10;
      ctx.save();
      ctx.globalAlpha = 0.3+Math.random()*0.6;
      ctx.fillStyle = Math.random()>0.5 ? color : '#ff9e64';
      ctx.beginPath(); ctx.rect(0,y0,64,h); ctx.clip();
      ctx.fillText(hex, 32+xOff, 20);
      ctx.restore();
    }
    return new THREE.CanvasTexture(c);
  }

  // ─────────────────────────────────────────────
  // ATTACK TYPES
  // ─────────────────────────────────────────────
  const ATTACK_TYPES = [
    { label:'SYN → :22',    flags:'02', dport:'00 16', color:'#f7768e' },
    { label:'SYN → :3389',  flags:'02', dport:'0D 3D', color:'#f7768e' },
    { label:'XMAS → :443',  flags:'29', dport:'01 BB', color:'#ff9e64' },
    { label:'NULL → :80',   flags:'00', dport:'00 50', color:'#f7768e' },
    { label:'SYN → :8080',  flags:'02', dport:'1F 90', color:'#ff9e64' },
    { label:'ACK → :21',    flags:'10', dport:'00 15', color:'#f7768e' },
    { label:'EXPLOIT :445', flags:'18', dport:'01 BD', color:'#ff9e64' },
    { label:'SYN → :23',   flags:'02', dport:'00 17', color:'#f7768e' },
  ];

  function buildRedPacket(scene, attack, x, startY, vy, cache) {
    const color = attack.color;
    const rawBytes = [
      'FF','FF','FF','FF','FF','FF',
      rndHex(),rndHex(),rndHex(),rndHex(),rndHex(),rndHex(),
      '08','00','45','00',rndHex(),rndHex(),rndHex(),rndHex(),'40','00',
      '40','06',rndHex(),rndHex(),
      rndHex(),rndHex(),rndHex(),rndHex(),
      rndHex(),rndHex(),rndHex(),rndHex(),
      rndHex(),rndHex(),...attack.dport.split(' '),
      rndHex(),rndHex(),rndHex(),rndHex(),
      rndHex(),rndHex(),rndHex(),rndHex(),
      '50',attack.flags,rndHex(),rndHex(),rndHex(),rndHex(),'00','00',
    ];
    const ws  = 14 + Math.floor(Math.random()*10);
    const displayed = rawBytes.slice(ws, ws+8);
    const SPACING   = 5.5;
    const byteSprites = [];
    for (let i=0; i<displayed.length; i++) {
      const mat = new THREE.SpriteMaterial({
        map: makeByteTexture(displayed[i], color, true, cache),
        transparent:true, blending:THREE.AdditiveBlending,
        opacity:0.8, depthWrite:false,
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(5,3,1);
      sp.position.set(x, startY - i*SPACING, (Math.random()-0.5)*4);
      scene.add(sp);
      byteSprites.push(sp);
    }
    const labelSp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeLabelTexture(attack.label, color, cache),
      transparent:true, blending:THREE.AdditiveBlending,
      opacity:0.9, depthWrite:false,
    }));
    labelSp.scale.set(18,3,1);
    labelSp.position.set(x+4, startY+5, 0);
    scene.add(labelSp);
    return { byteSprites, labelSprite:labelSp, x, vy,
             state:'falling', glitchTick:0,
             glitchMax:8+Math.floor(Math.random()*8),
             canBreakThrough: Math.random()<0.12,
             displayed, color };
  }

  // ─────────────────────────────────────────────
  // RED TEAM SCENE
  // ─────────────────────────────────────────────
  function createRedTeam() {
    const canvas = document.getElementById('redCanvas');
    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    let W=canvas.parentElement.clientWidth, H=canvas.parentElement.clientHeight;
    renderer.setSize(W,H);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(60,W/H,0.1,500);
    camera.position.z=90;

    const FIREWALL_Y=-50, SPAWN_Y=65;
    const cache={}, packets=[];
    let spawnTimer=0;

    function spawn() {
      const attack=ATTACK_TYPES[Math.floor(Math.random()*ATTACK_TYPES.length)];
      const lane=Math.floor(Math.random()*9)-4;
      const x=lane*16+(Math.random()-0.5)*4;
      packets.push(buildRedPacket(scene,attack,x,SPAWN_Y,-(0.08+Math.random()*0.12),cache));
    }

    for (let i=0;i<6;i++) {
      spawn();
      const p=packets[packets.length-1];
      const off=Math.random()*(SPAWN_Y-FIREWALL_Y);
      p.byteSprites.forEach(sp=>sp.position.y-=off);
      p.labelSprite.position.y-=off;
    }

    function kill(p) {
      p.byteSprites.forEach(sp=>scene.remove(sp));
      scene.remove(p.labelSprite);
      p.state='dead';
    }

    let frame=0;
    (function animate() {
      requestAnimationFrame(animate);
      frame++;
      spawnTimer++;
      if (spawnTimer>55 && packets.filter(p=>p.state!=='dead').length<10) { spawn(); spawnTimer=0; }

      for (let i=packets.length-1;i>=0;i--) {
        const p=packets[i];
        if (p.state==='dead') { packets.splice(i,1); continue; }

        if (p.state==='falling') {
          p.byteSprites.forEach(sp=>sp.position.y+=p.vy);
          p.labelSprite.position.y+=p.vy;
          if (p.byteSprites[p.byteSprites.length-1].position.y<=FIREWALL_Y) {
            p.state = p.canBreakThrough ? 'through' : 'glitching';
            if (p.state==='through') {
              p.byteSprites.forEach(sp=>sp.material.opacity=0.3);
              p.labelSprite.material.opacity=0.25;
            }
          }
        } else if (p.state==='glitching') {
          p.glitchTick++;
          const prog=p.glitchTick/p.glitchMax;
          p.byteSprites.forEach((sp,si)=>{
            if (p.glitchTick%2===0) {
              sp.material.map=makeGlitchTexture(p.displayed[si]||rndHex(),p.color);
              sp.material.needsUpdate=true;
              sp.position.x+=(Math.random()-0.5)*2.5;
              sp.position.y+=(Math.random()-0.5)*1.5;
            }
            sp.material.opacity=0.8*(1-prog);
            const sc=5*(1-prog*0.4); sp.scale.set(sc,3*(1-prog*0.4),1);
          });
          p.labelSprite.material.opacity=0.9*(1-prog);
          if (p.glitchTick>=p.glitchMax) kill(p);
        } else if (p.state==='through') {
          p.byteSprites.forEach(sp=>{ sp.position.y+=p.vy*0.6; sp.material.opacity-=0.004; });
          p.labelSprite.position.y+=p.vy*0.6;
          p.labelSprite.material.opacity-=0.004;
          if (p.byteSprites[0].material.opacity<=0) kill(p);
        }
      }
      renderer.render(scene,camera);
    })();

    window.addEventListener('resize',()=>{
      W=canvas.parentElement.clientWidth; H=canvas.parentElement.clientHeight;
      camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
    });
  }

  // ─────────────────────────────────────────────
  // BLUE TEAM — SIEM / IDS SENTINEL SCENE
  // ─────────────────────────────────────────────
  function createBlueTeam() {
    const canvas = document.getElementById('blueCanvas');
    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    let W=canvas.parentElement.clientWidth, H=canvas.parentElement.clientHeight;
    renderer.setSize(W,H);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(60,W/H,0.1,500);
    camera.position.z=90;

    // World bounds (at z=0, fov=60, dist=90: half-height≈51.96, half-width≈aspect*51.96)
    // We use fixed world coords; these feel right for a 16:9-ish viewport
    const BX=70, BY=50; // half-extents of patrol boundary

    const C_BLUE  = '#7aa2f7';
    const C_PURP  = '#bb9af7';
    const C_DIM   = '#3d5a8a';
    const C_ALERT = '#ff9e64';
    const cache={};

    // ── LAYER 1: PERIMETER PATROL ─────────────────
    // Bytes march clockwise around a rectangle.
    // Perimeter = 2*(2BX + 2BY) world units.
    // We place ~60 bytes evenly spaced and march them.

    const PERIM_COUNT = 60;
    const perimSprites = [];
    // Total perimeter length
    const PW = BX*2, PH = BY*2;
    const PERIM = 2*(PW+PH);

    // Convert a 0..PERIM distance to x,y on the rectangle (clockwise from top-left)
    function perimPos(d) {
      d = ((d % PERIM) + PERIM) % PERIM;
      if (d < PW)            return { x: -BX + d,        y:  BY }; // top: left→right
      d -= PW;
      if (d < PH)            return { x:  BX,             y:  BY - d }; // right: top→bottom
      d -= PH;
      if (d < PW)            return { x:  BX - d,        y: -BY }; // bottom: right→left
      d -= PW;
               return { x: -BX,             y: -BY + d }; // left: bottom→top
    }

    for (let i=0; i<PERIM_COUNT; i++) {
      const t = (i/PERIM_COUNT)*PERIM;
      const hex = rndHex();
      // Alternate blue/purple tint
      const col = i%3===0 ? C_PURP : C_BLUE;
      const mat = new THREE.SpriteMaterial({
        map: makeByteTexture(hex, col, true, cache),
        transparent:true, blending:THREE.AdditiveBlending,
        opacity: 0.45+Math.random()*0.3, depthWrite:false,
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(4.5,2.8,1);
      const pos = perimPos(t);
      sp.position.set(pos.x, pos.y, (Math.random()-0.5)*3);
      scene.add(sp);
      perimSprites.push({ sp, dist:t, hex, col,
        // random phase offset so they don't all pulse together
        pulsePhase: Math.random()*Math.PI*2,
        alertFlash: 0, // when >0 flash bright orange
      });
    }

    // ── LAYER 2: SCAN SWEEP LINE ──────────────────
    // A horizontal row of hex bytes sweeps top→bottom slowly.
    // The line itself is a thin LineSegments; bytes sit just below it.

    const SCAN_COLS    = 18;  // bytes across
    const SCAN_SPACING = PW*2/SCAN_COLS;
    const scanBytes    = [];
    let   scanY        = BY;  // current sweep Y, starts at top
    const SCAN_SPEED   = 0.12;

    // Build scan line geometry
    const scanLinePts = [
      new THREE.Vector3(-BX, 0, 0),
      new THREE.Vector3( BX, 0, 0),
    ];
    const scanLineGeo = new THREE.BufferGeometry().setFromPoints(scanLinePts);
    const scanLineMat = new THREE.LineBasicMaterial({color:0x7aa2f7, transparent:true, opacity:0.35});
    const scanLine    = new THREE.Line(scanLineGeo, scanLineMat);
    scanLine.position.y = scanY;
    scene.add(scanLine);

    // A glow trail line slightly behind
    const trailLineMat = new THREE.LineBasicMaterial({color:0x7aa2f7, transparent:true, opacity:0.1});
    const trailLine    = new THREE.Line(new THREE.BufferGeometry().setFromPoints(scanLinePts), trailLineMat);
    trailLine.position.y = scanY + 3;
    scene.add(trailLine);

    for (let i=0; i<SCAN_COLS; i++) {
      const x = -BX + i*SCAN_SPACING + SCAN_SPACING*0.5;
      const mat = new THREE.SpriteMaterial({
        map: makeByteTexture(rndHex(), C_BLUE, false, cache),
        transparent:true, blending:THREE.AdditiveBlending,
        opacity:0.0, depthWrite:false,
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(4.5,2.8,1);
      sp.position.set(x, scanY-3.5, 1);
      scene.add(sp);
      scanBytes.push({ sp, x });
    }

    // ── LAYER 3: ALERT RESPONSE COLUMNS ──────────────
    // When triggered, a neat column of labelled bytes snaps into place
    // near the top (firewall side), holds for a moment, then fades.

    const ALERT_LABELS = [
      'RST ← :22',  'DROP :3389', 'BLOCK :443', 'FW RULE :80',
      'IDS ALERT',  'ACK ← :21', 'DROP :445',  'RST ← :23',
      'RULE #0x2F', 'LOG EVENT',  'QUARANTINE', 'BLACKLIST',
    ];
    const alertColumns = [];
    let alertTimer = 0;
    const ALERT_INTERVAL = 120; // frames between alerts

    function spawnAlertColumn() {
      // Pick a horizontal x lane — avoid centre where links are
      const lanes = [-56,-42,-28, 28,42,56];
      const x = lanes[Math.floor(Math.random()*lanes.length)];
      const label = ALERT_LABELS[Math.floor(Math.random()*ALERT_LABELS.length)];
      const col = Math.random()>0.5 ? C_BLUE : C_PURP;

      // 6 hex bytes in a rigid column + label header
      const ROWS=6, ROW_H=5;
      const byteSprites=[];
      for (let r=0;r<ROWS;r++) {
        const hex=rndHex();
        const mat = new THREE.SpriteMaterial({
          map: makeByteTexture(hex, col, true, cache),
          transparent:true, blending:THREE.AdditiveBlending,
          opacity:0, depthWrite:false,
        });
        const sp = new THREE.Sprite(mat);
        sp.scale.set(5,3,1);
        // Top of column sits near firewall (BY), stack downward
        sp.position.set(x, BY - 4 - r*ROW_H, 2);
        scene.add(sp);
        byteSprites.push({sp, hex, r});
      }

      // Label sprite
      const labelSp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: makeLabelTexture('▶ '+label, col, cache),
        transparent:true, blending:THREE.AdditiveBlending,
        opacity:0, depthWrite:false,
      }));
      labelSp.scale.set(20,3,1);
      labelSp.position.set(x+2, BY+2, 2);
      scene.add(labelSp);

      // Bracket lines — left and right of column (rendered as line pairs)
      function makeBracket(side) {
        const bx = x + side*4.5;
        const pts = [
          new THREE.Vector3(bx, BY-1, 2),
          new THREE.Vector3(bx+side*2, BY-1, 2),
          new THREE.Vector3(bx+side*2, BY-1, 2),
          new THREE.Vector3(bx+side*2, BY-4-ROWS*ROW_H, 2),
          new THREE.Vector3(bx+side*2, BY-4-ROWS*ROW_H, 2),
          new THREE.Vector3(bx, BY-4-ROWS*ROW_H, 2),
        ];
        const geo=new THREE.BufferGeometry().setFromPoints(pts);
        const mat=new THREE.LineBasicMaterial({color:0x7aa2f7,transparent:true,opacity:0});
        const line=new THREE.LineSegments(geo,mat);
        scene.add(line);
        return line;
      }
      const bracketL=makeBracket(-1), bracketR=makeBracket(1);

      alertColumns.push({
        byteSprites, labelSp, bracketL, bracketR,
        state:'in',   // 'in' | 'hold' | 'out'
        tick:0,
        inDur:12, holdDur:80, outDur:20,
        col,
      });

      // Pulse perimeter bytes near the alert x as a "ping"
      for (const pb of perimSprites) {
        if (Math.abs(pb.sp.position.x - x) < 20) pb.alertFlash = 18;
      }
    }

    // ── ANIMATION LOOP ────────────────────────────
    let frame=0;
    (function animate() {
      requestAnimationFrame(animate);
      frame++;
      const t = frame * 0.016; // approx seconds

      // — Perimeter patrol —
      const PATROL_SPEED = 0.22;
      for (const pb of perimSprites) {
        pb.dist = (pb.dist + PATROL_SPEED) % PERIM;
        const pos = perimPos(pb.dist);
        pb.sp.position.x = pos.x;
        pb.sp.position.y = pos.y;

        // Refresh hex every full lap (roughly) with some randomness
        if (Math.random() < 0.002) {
          pb.hex = rndHex();
          pb.sp.material.map = makeByteTexture(pb.hex, pb.alertFlash>0 ? C_ALERT : pb.col, true, cache);
          pb.sp.material.needsUpdate = true;
        }

        // Alert flash
        if (pb.alertFlash > 0) {
          pb.alertFlash--;
          pb.sp.material.opacity = 0.9;
          pb.sp.material.map = makeByteTexture(pb.hex, C_ALERT, true, cache);
          pb.sp.material.needsUpdate = true;
        } else {
          pb.sp.material.opacity = 0.35 + 0.18*Math.sin(t*1.2 + pb.pulsePhase);
        }
      }

      // — Scan sweep —
      scanY -= SCAN_SPEED;
      if (scanY < -BY) { scanY = BY; }
      scanLine.position.y  = scanY;
      trailLine.position.y = scanY + 2.5;

      // Update scan byte positions and refresh their hex values as sweep passes
      for (const sb of scanBytes) {
        sb.sp.position.y = scanY - 3.5;
        // Fade in at top, hold, fade out near bottom
        const relY = (scanY - (-BY)) / (BY*2); // 0=bottom, 1=top
        sb.sp.material.opacity = 0.55 * Math.sin(relY * Math.PI);
        // Refresh bytes as sweep moves
        if (frame % 6 === 0) {
          sb.sp.material.map = makeByteTexture(rndHex(), C_BLUE, false, cache);
          sb.sp.material.needsUpdate = true;
        }
      }
      // Pulse scan line opacity with a slight flicker
      scanLineMat.opacity = 0.25 + 0.15*Math.sin(t*8);

      // — Alert columns —
      alertTimer++;
      if (alertTimer >= ALERT_INTERVAL) { spawnAlertColumn(); alertTimer=0; }

      for (let i=alertColumns.length-1; i>=0; i--) {
        const ac=alertColumns[i];
        ac.tick++;

        let prog, opacity;
        if (ac.state==='in') {
          prog    = ac.tick / ac.inDur;
          opacity = prog;
          if (ac.tick>=ac.inDur) { ac.state='hold'; ac.tick=0; }
        } else if (ac.state==='hold') {
          opacity = 1;
          // Softly cycle hex values to look "live"
          if (ac.tick % 14 === 0) {
            const rb = ac.byteSprites[Math.floor(Math.random()*ac.byteSprites.length)];
            rb.hex = rndHex();
            rb.sp.material.map = makeByteTexture(rb.hex, ac.col, true, cache);
            rb.sp.material.needsUpdate = true;
          }
          if (ac.tick>=ac.holdDur) { ac.state='out'; ac.tick=0; }
        } else {
          prog    = ac.tick / ac.outDur;
          opacity = 1 - prog;
          if (ac.tick>=ac.outDur) {
            // Remove everything
            ac.byteSprites.forEach(b=>scene.remove(b.sp));
            scene.remove(ac.labelSp);
            scene.remove(ac.bracketL);
            scene.remove(ac.bracketR);
            alertColumns.splice(i,1);
            continue;
          }
        }

        // Apply opacity to all parts
        ac.byteSprites.forEach(b=>{ b.sp.material.opacity=opacity*0.85; });
        ac.labelSp.material.opacity = opacity*0.9;
        ac.bracketL.material.opacity = opacity*0.5;
        ac.bracketR.material.opacity = opacity*0.5;
      }

      renderer.render(scene,camera);
    })();

    window.addEventListener('resize',()=>{
      W=canvas.parentElement.clientWidth; H=canvas.parentElement.clientHeight;
      camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
    });
  }

  window.addEventListener('load',()=>{ createRedTeam(); createBlueTeam(); });
  </script>
</body>
</html>
