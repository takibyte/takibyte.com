<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>takibyte</title>
  <meta name="description" content="takibyte's personal website and link tree to blog, github, and tryhackme.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --background: #1a1b26;
      --overlay: #24283b;
      --text: #c0caf5;
      --accent1: #bb9af7;
      --accent2: #7aa2f7;
      --accent3: #ff9e64;
      --accent4: #f7768e;
    }
    @font-face {
      font-display: swap;
      font-family: 'Roboto Mono';
      font-style: normal;
      font-weight: 400;
      src: url('https://fonts.gstatic.com/s/robotomono/v23/L0xuDF4xlVMF-BfR8bXMIhJHg45mwgGEFl0_3vqPQ--5Ip2sSQ.woff2') format('woff2');
    }
    html { font-size: 62.5%; }
    body {
      background-color: var(--background);
      color: var(--accent4);
      font-family: 'Roboto Mono', monospace;
      margin: 0; padding: 0;
      font-size: 2rem;
      overflow-x: hidden;
    }
    a { color: var(--accent2); text-decoration: none; }
    a:hover { color: var(--accent1); }
    .section {
      position: relative;
      display: grid;
      place-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .takibyte {
      background-image: radial-gradient(ellipse at 50% 100%, rgba(247,118,142,.08) 0%, transparent 75%);
    }
    .link-tree { background-color: var(--overlay); }
    .three-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .section-content {
      position: relative; z-index: 1;
      display: grid;
      grid-auto-flow: column;
      justify-content: center;
      gap: 1rem;
      font-size: 5rem;
    }
    .link-tree-content {
      position: relative; z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      align-content: center;
      gap: 5rem;
      text-align: center;
      padding: 0 2rem;
      font-size: 5rem;
    }
    .divider {
      position: relative;
      height: 2px;
      background-image: linear-gradient(90deg, #1a1b26, #f7768e, #ff9e64, #f7768e, #1a1b26);
      z-index: 10;
      box-shadow: 0 0 18px 4px rgba(247,118,142,0.45), 0 0 55px 12px rgba(247,118,142,0.18);
    }
    .scroll-indicator {
      position: fixed;
      bottom: 5rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      opacity: 1; transition: opacity 0.4s ease;
      pointer-events: none; z-index: 100;
    }
    .scroll-indicator.hidden { opacity: 0; }
    .scroll-arrow-wrapper { animation: bounce 1.4s ease-in-out infinite; }
    .scroll-arrow {
      width: 2rem; height: 2rem;
      border-right: 2px solid var(--text);
      border-bottom: 2px solid var(--text);
      transform: rotate(45deg);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(6px); }
    }
  </style>
</head>
<body>

  <div class="section takibyte">
    <canvas class="three-canvas" id="redCanvas"></canvas>
    <div class="section-content" id="titleSection"></div>
  </div>

  <div class="divider"></div>

  <div class="section link-tree">
    <canvas class="three-canvas" id="blueCanvas"></canvas>
    <div class="link-tree-content">
      <a href="https://blog.takibyte.com">blog</a>
      <a href="https://github.com/takibyte">github</a>
      <a href="https://tryhackme.com/p/takibyte">tryhackme</a>
    </div>
  </div>

  <div class="scroll-indicator" id="scrollIndicator">
    <div class="scroll-arrow-wrapper"><div class="scroll-arrow"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // ── scroll indicator ──────────────────────────
  const indicator = document.getElementById('scrollIndicator');
  window.addEventListener('scroll', () => {
    indicator.classList.toggle('hidden', window.scrollY > window.innerHeight * 0.2);
  }, { passive: true });

  // ── binary title reveal ───────────────────────
  const word = 'takibyte';
  function getByte(ch) {
    const c = ch.charCodeAt(0);
    return Array.from({length:8},(_,i)=>String((c>>(7-i))&1));
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function animateChar(el, ch, delay, spd) {
    el.textContent = '\u00a0'; await sleep(delay);
    for (const b of getByte(ch)) { el.textContent = b; await sleep(spd); }
    await sleep(400); el.textContent = ch;
  }
  async function runEffect() {
    const el = document.querySelector('.section-content');
    el.innerHTML = [...word].map((_,i)=>`<span id="bc${i}"></span>`).join('');
    await sleep(10);
    await Promise.all([...word].map((ch,i)=>animateChar(document.getElementById('bc'+i),ch,i*50,200)));
  }
  async function titleLoop() { await runEffect(); await sleep(4000); titleLoop(); }
  document.addEventListener('DOMContentLoaded', titleLoop);

  // ─────────────────────────────────────────────────────────────────
  // SHARED CANVAS TEXTURE HELPERS
  // ─────────────────────────────────────────────────────────────────

  // Render a single hex byte label e.g. "A3" as a sprite texture
  function makeByteTexture(hexStr, color, glowing) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 22px "Roboto Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (glowing) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
    ctx.fillStyle = color;
    ctx.fillText(hexStr, 32, 20);
    return new THREE.CanvasTexture(c);
  }

  // Render a packet label e.g. "SYN → :22"
  function makeLabelTexture(text, color) {
    const c = document.createElement('canvas');
    c.width = 220; c.height = 36;
    const ctx = c.getContext('2d');
    ctx.font = '13px "Roboto Mono", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.fillText(text, 4, 18);
    return new THREE.CanvasTexture(c);
  }

  // Glitched texture for dissolve
  function makeGlitchTexture(hexStr, color) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 22px "Roboto Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const bands = 4 + Math.floor(Math.random()*4);
    for (let b = 0; b < bands; b++) {
      const y0 = (b/bands)*40, h = 40/bands;
      const xOff = (Math.random()-0.5)*10;
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.random()*0.6;
      ctx.fillStyle = Math.random() > 0.5 ? color : '#ff9e64';
      ctx.beginPath(); ctx.rect(0, y0, 64, h); ctx.clip();
      ctx.fillText(hexStr, 32+xOff, 20);
      ctx.restore();
    }
    return new THREE.CanvasTexture(c);
  }

  // Random hex byte string
  const HEX = '0123456789ABCDEF';
  function rndHex() { return HEX[Math.floor(Math.random()*16)]+HEX[Math.floor(Math.random()*16)]; }

  // ─────────────────────────────────────────────────────────────────
  // PACKET DEFINITIONS — roughly realistic framing
  // ─────────────────────────────────────────────────────────────────

  // Ethernet(14) + IP(20) + TCP(20) broken into labelled sections
  // Each section: { label, bytes: number }
  // We pick a subset to display as a scrolling stream
  const ATTACK_TYPES = [
    { label: 'SYN → :22',    flags: '02', dport: '00 16', color: '#f7768e' }, // SSH
    { label: 'SYN → :3389',  flags: '02', dport: '0D 3D', color: '#f7768e' }, // RDP
    { label: 'XMAS → :443',  flags: '29', dport: '01 BB', color: '#ff9e64' }, // HTTPS
    { label: 'NULL → :80',   flags: '00', dport: '00 50', color: '#f7768e' }, // HTTP
    { label: 'SYN → :8080',  flags: '02', dport: '1F 90', color: '#ff9e64' },
    { label: 'ACK SCAN :21', flags: '10', dport: '00 15', color: '#f7768e' }, // FTP
    { label: 'EXPLOIT :445', flags: '18', dport: '01 BD', color: '#ff9e64' }, // SMB
    { label: 'SYN → :23',   flags: '02', dport: '00 17', color: '#f7768e' }, // Telnet
  ];

  const DEFENSE_TYPES = [
    { label: 'RST ← :22',    color: '#7aa2f7' },
    { label: 'DROP :3389',   color: '#bb9af7' },
    { label: 'BLOCK :443',   color: '#7aa2f7' },
    { label: 'FW RULE :80',  color: '#bb9af7' },
    { label: 'IDS ALERT',    color: '#7aa2f7' },
    { label: 'ACK ← :21',   color: '#bb9af7' },
    { label: 'DROP :445',    color: '#7aa2f7' },
    { label: 'RST ← :23',   color: '#bb9af7' },
  ];

  // Build a packet: an array of hex byte sprites arranged in a vertical column
  // Returns { sprites[], labelSprite, x, vy, state, ... }
  function buildPacket(scene, attackType, x, startY, vy, texCache) {
    const color = attackType.color;

    // Construct a plausible Ethernet+IP+TCP byte sequence
    // dst MAC, src MAC, ethertype, IP header bytes, TCP header bytes
    const rawBytes = [
      // Ethernet dst (6) + src (6)
      'FF','FF','FF','FF','FF','FF',
      rndHex(),rndHex(),rndHex(),rndHex(),rndHex(),rndHex(),
      // Ethertype IPv4
      '08','00',
      // IP: version/IHL, DSCP, total len (2), id (2), flags/frag (2)
      '45','00', rndHex(),rndHex(), rndHex(),rndHex(), '40','00',
      // TTL, proto TCP, checksum (2)
      '40','06', rndHex(),rndHex(),
      // src IP (4), dst IP (4)
      rndHex(),rndHex(),rndHex(),rndHex(),
      rndHex(),rndHex(),rndHex(),rndHex(),
      // TCP sport (2), dport (2 from attack type)
      rndHex(),rndHex(), ...attackType.dport.split(' '),
      // seq(4), ack(4), offset/flags, window(2), checksum(2), urgent(2)
      rndHex(),rndHex(),rndHex(),rndHex(),
      rndHex(),rndHex(),rndHex(),rndHex(),
      '50', attackType.flags, rndHex(),rndHex(), rndHex(),rndHex(), '00','00',
    ];

    // Show a window of 8 bytes as the "stream" — pick from middle of frame
    const windowStart = 14 + Math.floor(Math.random() * 10);
    const displayed   = rawBytes.slice(windowStart, windowStart + 8);

    const byteSprites = [];
    const SPACING = 5.5;

    for (let i = 0; i < displayed.length; i++) {
      const hex = displayed[i];
      const key = hex + color;
      if (!texCache[key]) texCache[key] = makeByteTexture(hex, color, true);
      const mat = new THREE.SpriteMaterial({
        map: texCache[key], transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.8, depthWrite: false,
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(5, 3, 1);
      sp.position.set(x, startY - i * SPACING, (Math.random()-0.5)*4);
      scene.add(sp);
      byteSprites.push(sp);
    }

    // Label sprite above the stream
    const labelTex = makeLabelTexture(attackType.label, color);
    const labelMat = new THREE.SpriteMaterial({
      map: labelTex, transparent: true,
      blending: THREE.AdditiveBlending,
      opacity: 0.9, depthWrite: false,
    });
    const labelSp = new THREE.Sprite(labelMat);
    labelSp.scale.set(18, 3, 1);
    labelSp.position.set(x + 4, startY + 5, 0);
    scene.add(labelSp);

    return {
      byteSprites,
      labelSprite: labelSp,
      x, vy,
      state: 'falling',    // 'falling' | 'glitching' | 'through' | 'dead'
      glitchTick: 0,
      glitchMax: 8 + Math.floor(Math.random()*8),
      canBreakThrough: Math.random() < 0.12, // ~12% chance to get through
      displayed,
      color,
      glitchTextures: [],
    };
  }

  function buildDefensePacket(scene, defType, x, startY, vy, texCache) {
    const color = defType.color;
    const displayed = Array.from({length:8}, rndHex);
    const byteSprites = [];
    const SPACING = 5.5;

    for (let i = 0; i < displayed.length; i++) {
      const hex = displayed[i];
      const key = hex + color;
      if (!texCache[key]) texCache[key] = makeByteTexture(hex, color, true);
      const mat = new THREE.SpriteMaterial({
        map: texCache[key], transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.7, depthWrite: false,
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(5, 3, 1);
      sp.position.set(x, startY + i * SPACING, (Math.random()-0.5)*4);
      scene.add(sp);
      byteSprites.push(sp);
    }

    const labelTex = makeLabelTexture(defType.label, color);
    const labelMat = new THREE.SpriteMaterial({
      map: labelTex, transparent: true,
      blending: THREE.AdditiveBlending,
      opacity: 0.85, depthWrite: false,
    });
    const labelSp = new THREE.Sprite(labelMat);
    labelSp.scale.set(18, 3, 1);
    labelSp.position.set(x + 4, startY - 5, 0);
    scene.add(labelSp);

    return { byteSprites, labelSprite: labelSp, x, vy, state: 'rising', deadTick: 0, color };
  }

  // ─────────────────────────────────────────────────────────────────
  // RED TEAM SCENE
  // ─────────────────────────────────────────────────────────────────
  function createRedTeam() {
    const canvas = document.getElementById('redCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    let W = canvas.parentElement.clientWidth;
    let H = canvas.parentElement.clientHeight;
    renderer.setSize(W, H);
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 500);
    camera.position.z = 90;

    const FIREWALL_Y = -50;
    const SPAWN_Y    =  65;
    const texCache   = {};
    const packets    = [];
    let spawnTimer   = 0;

    function spawn() {
      const attack = ATTACK_TYPES[Math.floor(Math.random()*ATTACK_TYPES.length)];
      // Stagger x positions in lanes
      const lane = Math.floor(Math.random()*9) - 4;
      const x    = lane * 16 + (Math.random()-0.5)*4;
      const vy   = -(0.08 + Math.random()*0.12);
      packets.push(buildPacket(scene, attack, x, SPAWN_Y, vy, texCache));
    }

    // Seed a handful already mid-flight
    for (let i = 0; i < 6; i++) {
      spawn();
      const p = packets[packets.length-1];
      const offset = Math.random() * (SPAWN_Y - FIREWALL_Y);
      for (const sp of p.byteSprites) sp.position.y -= offset;
      p.labelSprite.position.y -= offset;
    }

    function killPacket(p) {
      for (const sp of p.byteSprites) scene.remove(sp);
      scene.remove(p.labelSprite);
      p.state = 'dead';
    }

    let frame = 0;
    function animate() {
      requestAnimationFrame(animate);
      frame++;

      spawnTimer++;
      const active = packets.filter(p => p.state !== 'dead').length;
      if (spawnTimer > 55 && active < 10) { spawn(); spawnTimer = 0; }

      for (let i = packets.length-1; i >= 0; i--) {
        const p = packets[i];
        if (p.state === 'dead') { packets.splice(i,1); continue; }

        if (p.state === 'falling') {
          for (const sp of p.byteSprites) sp.position.y += p.vy;
          p.labelSprite.position.y += p.vy;

          // Check if lead byte (last in array, lowest y) hits firewall
          const leadY = p.byteSprites[p.byteSprites.length-1].position.y;
          if (leadY <= FIREWALL_Y) {
            if (p.canBreakThrough) {
              p.state = 'through';
              // Dim the packet — it slipped past
              for (const sp of p.byteSprites) sp.material.opacity = 0.3;
              p.labelSprite.material.opacity = 0.25;
            } else {
              p.state = 'glitching';
            }
          }

        } else if (p.state === 'glitching') {
          p.glitchTick++;
          const prog = p.glitchTick / p.glitchMax;

          for (const sp of p.byteSprites) {
            if (p.glitchTick % 2 === 0) {
              const hex = p.displayed[p.byteSprites.indexOf(sp)] || rndHex();
              sp.material.map = makeGlitchTexture(hex, p.color);
              sp.material.needsUpdate = true;
              sp.position.x += (Math.random()-0.5)*2.5;
              sp.position.y += (Math.random()-0.5)*1.5;
            }
            sp.material.opacity = 0.8 * (1-prog);
            const sc = 5 * (1 - prog*0.4);
            sp.scale.set(sc, 3*(1-prog*0.4), 1);
          }
          p.labelSprite.material.opacity = 0.9 * (1-prog);
          if (p.glitchTick >= p.glitchMax) killPacket(p);

        } else if (p.state === 'through') {
          // Continue drifting down and fading out below the firewall
          for (const sp of p.byteSprites) sp.position.y += p.vy * 0.6;
          p.labelSprite.position.y += p.vy * 0.6;
          for (const sp of p.byteSprites) sp.material.opacity -= 0.004;
          p.labelSprite.material.opacity -= 0.004;
          if (p.byteSprites[0].material.opacity <= 0) killPacket(p);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      W = canvas.parentElement.clientWidth;
      H = canvas.parentElement.clientHeight;
      camera.aspect = W/H; camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    });
  }

  // ─────────────────────────────────────────────────────────────────
  // BLUE TEAM SCENE
  // ─────────────────────────────────────────────────────────────────
  function createBlueTeam() {
    const canvas = document.getElementById('blueCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    let W = canvas.parentElement.clientWidth;
    let H = canvas.parentElement.clientHeight;
    renderer.setSize(W, H);
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 500);
    camera.position.z = 90;

    // Top of this section (where the firewall is from blue's POV) = y = +50
    // Packets spawn at the bottom and rise toward it
    const FIREWALL_Y =  50;
    const SPAWN_Y    = -65;
    const texCache   = {};
    const packets    = [];
    let spawnTimer   = 0;

    // Faint ring decorations in background for depth
    const RINGS = [
      { r:20, ys:0.38, dir: 1, spd:0.0018 },
      { r:36, ys:0.43, dir:-1, spd:0.0013 },
      { r:52, ys:0.47, dir: 1, spd:0.0009 },
      { r:68, ys:0.49, dir:-1, spd:0.0006 },
    ];
    const ringMeshes = RINGS.map(ring => {
      const pts = [];
      for (let i=0;i<=80;i++) {
        const a=(i/80)*Math.PI*2;
        pts.push(new THREE.Vector3(Math.cos(a)*ring.r, Math.sin(a)*ring.r*ring.ys, 0));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({color:0x7aa2f7, transparent:true, opacity:0.055});
      const mesh = new THREE.Line(geo, mat);
      scene.add(mesh);
      return { mesh, ...ring, angle: 0 };
    });

    function spawn() {
      const def  = DEFENSE_TYPES[Math.floor(Math.random()*DEFENSE_TYPES.length)];
      const lane = Math.floor(Math.random()*9) - 4;
      const x    = lane * 16 + (Math.random()-0.5)*4;
      const vy   =  0.07 + Math.random()*0.10;
      packets.push(buildDefensePacket(scene, def, x, SPAWN_Y, vy, texCache));
    }

    // Seed mid-flight
    for (let i = 0; i < 6; i++) {
      spawn();
      const p = packets[packets.length-1];
      const offset = Math.random() * (FIREWALL_Y - SPAWN_Y);
      for (const sp of p.byteSprites) sp.position.y += offset;
      p.labelSprite.position.y += offset;
    }

    function killPacket(p) {
      for (const sp of p.byteSprites) scene.remove(sp);
      scene.remove(p.labelSprite);
      p.state = 'dead';
    }

    let frame = 0;
    function animate() {
      requestAnimationFrame(animate);
      frame++;

      // Slowly rotate rings
      for (const r of ringMeshes) {
        r.angle += r.dir * r.spd;
        r.mesh.rotation.z = r.angle;
      }

      spawnTimer++;
      const active = packets.filter(p=>p.state!=='dead').length;
      if (spawnTimer > 55 && active < 10) { spawn(); spawnTimer = 0; }

      for (let i = packets.length-1; i >= 0; i--) {
        const p = packets[i];
        if (p.state === 'dead') { packets.splice(i,1); continue; }

        if (p.state === 'rising') {
          for (const sp of p.byteSprites) sp.position.y += p.vy;
          p.labelSprite.position.y += p.vy;

          const leadY = p.byteSprites[p.byteSprites.length-1].position.y;

          // As packet approaches firewall, flash brighter
          if (leadY > FIREWALL_Y - 15) {
            const nearness = 1 - Math.min((FIREWALL_Y - leadY)/15, 1);
            for (const sp of p.byteSprites) sp.material.opacity = 0.7 + nearness*0.3;
          }

          if (leadY >= FIREWALL_Y) {
            // Reached firewall — "delivered", fade out quickly
            p.state = 'dispatched';
          }

        } else if (p.state === 'dispatched') {
          p.deadTick++;
          const prog = p.deadTick / 12;
          for (const sp of p.byteSprites) {
            sp.position.y += p.vy * 0.4;
            sp.material.opacity = 0.7 * (1-prog);
          }
          p.labelSprite.material.opacity = 0.85 * (1-prog);
          if (p.deadTick >= 12) killPacket(p);
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      W = canvas.parentElement.clientWidth;
      H = canvas.parentElement.clientHeight;
      camera.aspect = W/H; camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    });
  }

  window.addEventListener('load', () => {
    createRedTeam();
    createBlueTeam();
  });
  </script>
</body>
</html>
