<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>takibyte</title>
  <meta name="description" content="takibyte link website — abstract firewall simulation, with red team / blue team network traffic. Links for my cybersecurity homelab, GitHub, and TryHackMe profile.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1b26">
  <meta name="color-scheme" content="dark">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/icons/site.webmanifest">

  <!-- Styles -->
  <link rel="stylesheet" type="text/css" media="screen" href="/main.css">

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>

  <!-- Scripts (deferred so DOM is ready) -->
  <script type="module" src="/main.js" defer></script>
</head>
<body>

  <main>

    <!-- RED TEAM SECTION -->
    <div class="section takibyte">
      <canvas class="three-canvas" id="redCanvas"></canvas>
      <div class="section-content" id="titleSection"></div>
    </div>

    <!-- FIREWALL DIVIDER -->
    <div class="divider"></div>

    <!-- BLUE TEAM SECTION -->
    <div class="section link-tree">
      <canvas class="three-canvas" id="blueCanvas"></canvas>
      <nav class="link-tree-content" aria-label="Links">
        <a href="https://lab.takibyte.com">homelab</a>
        <a href="https://github.com/takibyte">github</a>
        <a href="https://tryhackme.com/p/takibyte">tryhackme</a>
      </nav>
    </div>

  </main>

  <div class="scroll-indicator" id="scrollIndicator">
    <div class="scroll-arrow-wrapper">
      <div class="scroll-arrow"></div>
    </div>
  </div>

</body>
</html>
